<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Nebula Drift</title><desc id="desc">Animated nebula screensaver for Android TV devices.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <g transform="translate(565 28)"><circle cx="83" cy="70" r="55" fill="#312e81"/><ellipse cx="78" cy="75" rx="65" ry="24" fill="#8b5cf6" opacity=".6" transform="rotate(-22 78 75)"/><ellipse cx="80" cy="78" rx="42" ry="13" fill="#ec4899" opacity=".7" transform="rotate(-22 80 78)"/><circle cx="38" cy="29" r="2" fill="#60a5fa"/><circle cx="141" cy="47" r="2" fill="#a78bfa"/><circle cx="122" cy="119" r="2" fill="#60a5fa"/><circle cx="27" cy="112" r="2" fill="#a78bfa"/></g>
  <text x="40" y="80" fill="#fff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Nebula Drift</text>
  <text x="42" y="108" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">No ads, analytics, or tracking. All motion stays on-device.</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle">
    <rect x="40" y="128" width="78" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#a78bfa" stroke-width=".8"/><text x="79" y="143" fill="#a78bfa">Animated</text>
    <rect x="126" y="128" width="72" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/><text x="162" y="143" fill="#60a5fa">Offline</text>
    <rect x="206" y="128" width="91" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/><text x="251" y="143" fill="#4ade80">No tracking</text>
    <rect x="305" y="128" width="108" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8"/><text x="359" y="143" fill="#fbbf24">No analytics</text>
  </g>
</svg>
