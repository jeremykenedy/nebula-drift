<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 800 200"><title id="title">Nebula Drift</title><desc id="desc">Animated nebula screensaver for Android TV devices.</desc><rect width="800" height="200" fill="#fff" stroke="#e5e7eb" rx="16"/><g transform="translate(565 28)"><circle cx="83" cy="70" r="55" fill="#312e81"/><ellipse cx="78" cy="75" fill="#8b5cf6" opacity=".6" rx="65" ry="24" transform="rotate(-22 78 75)"/><ellipse cx="80" cy="78" fill="#ec4899" opacity=".7" rx="42" ry="13" transform="rotate(-22 80 78)"/><circle cx="38" cy="29" r="2" fill="#2563eb"/><circle cx="141" cy="47" r="2" fill="#7c3aed"/><circle cx="122" cy="119" r="2" fill="#2563eb"/><circle cx="27" cy="112" r="2" fill="#7c3aed"/></g><text x="40" y="80" fill="#0f172a" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Nebula Drift</text><text x="42" y="108" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">No ads, analytics, or tracking. All motion stays on-device.</text><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle"><rect width="78" height="22" x="40" y="128" fill="#f5f3ff" stroke="#c4b5fd" stroke-width=".8" rx="11"/><text x="79" y="143" fill="#6d28d9">Animated</text><rect width="72" height="22" x="126" y="128" fill="#eff6ff" stroke="#93c5fd" stroke-width=".8" rx="11"/><text x="162" y="143" fill="#1e40af">Offline</text><rect width="91" height="22" x="206" y="128" fill="#f0fdf4" stroke="#86efac" stroke-width=".8" rx="11"/><text x="251" y="143" fill="#166534">No tracking</text><rect width="108" height="22" x="305" y="128" fill="#fffbeb" stroke="#fcd34d" stroke-width=".8" rx="11"/><text x="359" y="143" fill="#b45309">No analytics</text></g></svg>