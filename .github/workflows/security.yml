name: Security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt pip-audit==2.10.1
      - run: python -m pip_audit --strict -r requirements-dev.txt
      - run: bandit -q -ll install.py
      - run: python -O -m unittest test_install
      - run: bash scripts/check-secrets.sh
      - name: Verify app has no network permissions
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          bash build.sh --unsigned
